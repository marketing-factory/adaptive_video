name: Tests

on: [ push, pull_request ]

jobs:
  tests:
    name: TYPO3 ${{ matrix.typo3 }}, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { typo3: '^13.4', php: '8.2' }
          - { typo3: '^13.4', php: '8.4' }
          - { typo3: '^14.0', php: '8.2' }
          - { typo3: '^14.0', php: '8.5' }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      typo3DatabaseDriver: mysqli
      typo3DatabaseHost: 127.0.0.1
      typo3DatabasePort: 3306
      typo3DatabaseUsername: root
      typo3DatabasePassword: root
      typo3DatabaseName: func
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, mysqli, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require --no-update "typo3/cms-core:${{ matrix.typo3 }}"
          composer require --no-update --dev "typo3/cms-filemetadata:${{ matrix.typo3 }}"
          composer update --no-progress --prefer-dist

      - name: Unit tests
        run: composer test:unit

      - name: Functional tests
        run: composer test:functional
